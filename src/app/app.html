<div class="relative flex h-screen w-screen overflow-hidden bg-[#060911] text-slate-100 font-sans selection:bg-emerald-500/30 selection:text-emerald-200">

  <!-- Shared Global Volumetric Aurora Backlights (Fluid Drifting Radial Glows) -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
    <!-- Primary Socket Core Aurora (Animated Drift 1) -->
    <div 
      class="absolute -top-[12%] left-[10%] w-[760px] h-[760px] rounded-full animate-aurora-drift-1 transition-all duration-1000"
      [style.background]="botService.status() === 'active' 
        ? 'radial-gradient(circle at center, rgba(16,185,129,0.42) 0%, rgba(5,150,105,0.22) 45%, transparent 72%)' 
        : (botService.status() === 'connecting' 
          ? 'radial-gradient(circle at center, rgba(245,158,11,0.45) 0%, rgba(217,119,6,0.2) 45%, transparent 72%)' 
          : 'radial-gradient(circle at center, rgba(225,29,72,0.38) 0%, rgba(159,18,57,0.18) 45%, transparent 72%)')"
    ></div>

    <!-- Secondary Atmospheric Cyan/Teal Ribbon (Animated Drift 2) -->
    <div 
      class="absolute top-[25%] right-[2%] w-[720px] h-[720px] rounded-full animate-aurora-drift-2 pointer-events-none"
      style="background: radial-gradient(circle at center, rgba(6,182,212,0.32) 0%, rgba(20,184,166,0.16) 48%, transparent 74%);"
    ></div>

    <!-- Tertiary Deep Violet/Indigo Nebula (Animated Drift 3) -->
    <div 
      class="absolute -bottom-[15%] left-[25%] w-[680px] h-[680px] rounded-full animate-aurora-drift-3 pointer-events-none"
      style="background: radial-gradient(circle at center, rgba(139,92,246,0.26) 0%, rgba(99,102,241,0.14) 52%, transparent 76%);"
    ></div>

    <!-- Center Atmospheric Depth Beam -->
    <div 
      class="absolute top-[45%] left-[40%] w-[500px] h-[500px] rounded-full blur-[160px] pointer-events-none opacity-20"
      style="background: radial-gradient(circle, rgba(45,212,191,0.35) 0%, transparent 65%);"
    ></div>
  </div>

  <!-- Desktop Sidebar -->
  <div class="hidden md:block h-full shrink-0 relative z-10">
    <app-sidebar />
  </div>

  <!-- Mobile Drawer Backdrop & Sidebar -->
  @if (mobileMenuOpen()) {
    <div 
      class="fixed inset-0 z-50 bg-black/80 backdrop-blur-2xl md:hidden flex"
      role="button"
      tabindex="0"
      aria-label="Cerrar menú móvil"
      (click)="closeMobileMenu()"
      (keydown.escape)="closeMobileMenu()"
      (keydown.enter)="closeMobileMenu()"
    >
      <div 
        class="w-64 h-full bg-[#060911]/90 backdrop-blur-3xl shadow-2xl relative border-r border-white/5"
        role="dialog"
        tabindex="0"
        aria-modal="true"
        aria-label="Menú de navegación móvil"
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
      >
        <button
          type="button"
          (click)="closeMobileMenu()"
          class="absolute top-4 right-4 text-slate-400 hover:text-white p-1"
          aria-label="Cerrar menú"
        >
          <mat-icon class="text-xl">close</mat-icon>
        </button>
        <app-sidebar />
      </div>
    </div>
  }

  <!-- Main Viewport -->
  <div class="flex-1 flex flex-col h-full overflow-hidden min-w-0 bg-transparent relative z-10">
    <!-- Mobile Header with Hamburger -->
    <div class="md:hidden flex items-center justify-between px-4 py-3 bg-[#060911]/80 backdrop-blur-xl border-b border-white/5 shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.3)]">
          <mat-icon class="text-base">chat</mat-icon>
        </div>
        <span class="text-xs font-bold text-white tracking-tight">Fernet WhatsApp Bot</span>
      </div>

      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="p-2 rounded-xl bg-white/5 text-slate-300 hover:text-white"
        aria-label="Abrir menú"
      >
        <mat-icon class="text-lg">menu</mat-icon>
      </button>
    </div>

    <!-- Active View Area (Scrollable with Translucent Backdrop) -->
    <main class="flex-1 overflow-y-auto bg-transparent">
      @switch (botService.activeScreen()) {
        @case ('inicio') {
          <app-v2-dashboard />
        }
        @case ('logs') {
          <app-logs-view />
        }
        @case ('imagenes') {
          <app-images-view />
        }
        @case ('contactos') {
          <app-contacts-view />
        }
        @case ('configuracion') {
          <app-settings-view />
        }
      }
    </main>
  </div>

  <!-- Global QR Pairing Modal -->
  @if (botService.showQrModal()) {
    <div 
      class="fixed inset-0 z-50 bg-black/80 backdrop-blur-2xl flex items-center justify-center p-4 sm:p-6"
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-label="Modal para vincular WhatsApp Web"
      (click)="botService.closeQrModal()"
      (keydown.escape)="botService.closeQrModal()"
    >
      <div 
        class="w-full max-w-3xl max-h-[92vh] overflow-y-auto rounded-3xl"
        role="region"
        tabindex="0"
        aria-label="Contenido del código QR"
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
      >
        <app-whatsapp-qr 
          mode="modal" 
          [canClose]="true" 
          (dismiss)="botService.closeQrModal()" 
        />
      </div>
    </div>
  }
</div>
