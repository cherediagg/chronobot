<div class="relative min-h-screen text-slate-100 overflow-x-hidden p-6 sm:p-10 max-w-[1600px] mx-auto select-none font-sans">

  <!-- WhatsApp Web QR Code Linker - Front & Center when Disconnected -->
  @if (botService.status() !== 'active') {
    <section class="mb-10" aria-label="Vinculación de WhatsApp Web">
      <app-whatsapp-qr mode="card" />
    </section>
  }

  <!-- Fluid Summary Metrics Atomic Component -->
  <app-dashboard-metrics />

  <!-- Full-Width Terminal Console Atomic Component -->
  <div class="mb-12">
    <app-terminal-console />
  </div>

  <!-- Cinematic Media Ribbon Atomic Component -->
  <app-media-ribbon (selectImage)="openImageDetails($event)" />

  <!-- Shared Image Lightbox Modal Atomic Component -->
  <app-image-lightbox-modal
    [image]="selectedImageForModal()"
    (closeModal)="closeImageModal()"
  />

</div>
