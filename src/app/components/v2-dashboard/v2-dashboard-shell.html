<div class="relative min-h-screen text-slate-100 overflow-x-hidden p-6 sm:p-10 max-w-[1600px] mx-auto select-none font-sans">
  @if (botService.status() !== 'active') {
    <section class="mb-10" aria-label="Vinculación de WhatsApp Web">
      <app-whatsapp-qr />
    </section>
  }

  <app-dashboard-metrics
    [status]="botService.status()"
    [authorizedContactsCount]="botService.authorizedContactsCount()"
    [savedImagesCount]="botService.savedImagesCount()"
    [formattedUptime]="botService.formattedUptime()"
    (toggleBot)="toggleBotFromStatus()"
    (openContacts)="navigateToEmployees()"
    (openImages)="navigateToImages()"
  />

  <app-dashboard-console
    [logs]="botService.logs()"
    [status]="botService.status()"
    [qrData]="botService.qrData()"
    [autoScroll]="botService.autoScroll()"
    (toggleAutoScroll)="botService.toggleAutoScroll()"
    (clearLogs)="botService.clearLogs()"
  />

  <app-dashboard-gallery
    [images]="botService.firstFiveImages()"
    [totalImagesCount]="botService.savedImagesCount()"
    (openImage)="openImageDetails($event)"
    (viewAllImages)="navigateToImages()"
  />

  @if (selectedImageForModal(); as img) {
    <div
      class="fixed inset-0 z-50 bg-black/85 backdrop-blur-2xl flex items-center justify-center p-6"
      role="button"
      tabindex="0"
      aria-label="Cerrar modal"
      (click)="closeImageModal()"
      (keydown.escape)="closeImageModal()"
      (keydown.enter)="closeImageModal()"
    >
      <div
        class="bg-[#0e1422]/90 border border-white/10 rounded-3xl max-w-3xl w-full overflow-hidden shadow-[0_0_100px_rgba(0,0,0,0.9)] backdrop-blur-3xl"
        role="dialog"
        tabindex="0"
        aria-modal="true"
        aria-label="Vista previa de imagen ampliada"
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
      >
        <div class="p-5 border-b border-white/5 flex items-center justify-between">
          <div>
            <h3 class="text-base font-bold text-white">{{ img.filename }}</h3>
            <p class="text-xs text-slate-400">Remitente: {{ img.senderName }} ({{ img.senderPhone }})</p>
          </div>
          <button
            type="button"
            (click)="closeImageModal()"
            class="w-9 h-9 rounded-xl bg-white/5 text-slate-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
            aria-label="Cerrar vista previa"
          >
            <mat-icon class="text-lg">close</mat-icon>
          </button>
        </div>

        <div class="bg-black/90 max-h-[65vh] flex items-center justify-center p-3">
          <img [src]="img.imageUrl" [alt]="img.filename" class="max-h-full max-w-full object-contain rounded-2xl shadow-2xl" />
        </div>

        <div class="p-5 bg-black/40 space-y-2 text-xs">
          <div class="flex items-center justify-between">
            <span class="text-slate-400">Ruta del archivo:</span>
            <span class="text-teal-400 font-mono">{{ img.path }}</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-slate-400">Resolución & Peso:</span>
            <span class="text-slate-200 font-mono">{{ img.dimensions }} · {{ img.size }}</span>
          </div>
        </div>
      </div>
    </div>
  }
</div>
