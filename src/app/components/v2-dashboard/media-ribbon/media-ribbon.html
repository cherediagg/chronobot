<div class="bg-[#0e1422]/80 border border-white/10 rounded-3xl p-6 backdrop-blur-xl space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-sm font-bold text-white flex items-center gap-2">
        <mat-icon class="text-cyan-400 text-lg">photo_library</mat-icon>
        Galería Reciente de Fotos
      </h2>
      <p class="text-xs text-slate-400">Últimas imágenes guardadas enviadas por contactos autorizados.</p>
    </div>

    <button
      type="button"
      (click)="viewAllImages.emit()"
      class="text-xs text-cyan-400 hover:text-cyan-300 font-semibold flex items-center gap-1 cursor-pointer"
    >
      <span>Ver galería completa ({{ totalImagesCount() }})</span>
      <mat-icon class="text-sm">chevron_right</mat-icon>
    </button>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
    @for (img of images().slice(0, 6); track img.id) {
      <div
        (click)="openImage.emit(img)"
        class="group relative aspect-square rounded-2xl overflow-hidden bg-black/40 border border-white/10 hover:border-cyan-400/50 cursor-pointer transition-all duration-300"
      >
        <img [src]="img.imageUrl" [alt]="img.senderName" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-2 flex flex-col justify-end">
          <span class="text-[10px] font-bold text-white truncate">{{ img.senderName }}</span>
          <span class="text-[9px] text-slate-400 font-mono">{{ img.dateFormatted }}</span>
        </div>
      </div>
    } @empty {
      <div class="col-span-full py-8 text-center text-slate-500 text-xs bg-black/20 rounded-2xl border border-white/5">
        No hay imágenes guardadas aún.
      </div>
    }
  </div>
</div>
