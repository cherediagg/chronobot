<aside class="w-64 bg-[#0a0d16]/90 border-r border-white/5 flex flex-col justify-between h-screen p-4 sticky top-0 backdrop-blur-xl">
  <div class="space-y-6">
    <!-- Header/Logo -->
    <div class="flex items-center gap-3 px-3 py-2">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)]">
        <mat-icon class="text-slate-950 font-bold text-xl">forum</mat-icon>
      </div>
      <div>
        <h1 class="text-sm font-black text-white tracking-wide">ChronoBot</h1>
        <p class="text-[10px] text-cyan-400/80 font-mono tracking-wider uppercase">Control Center</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="space-y-1">
      @for (item of navItems; track item.id) {
        <button
          type="button"
          (click)="selectTab(item.id)"
          class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-xs font-semibold transition-all duration-200 cursor-pointer group"
          [ngClass]="botService.activeScreen() === item.id
            ? 'bg-gradient-to-r from-cyan-500/20 to-blue-500/10 text-cyan-300 border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.15)]'
            : 'text-slate-400 hover:text-slate-200 hover:bg-white/[0.04] border border-transparent'"
        >
          <div class="flex items-center gap-3">
            <mat-icon class="text-lg transition-transform duration-200 group-hover:scale-110" [ngClass]="botService.activeScreen() === item.id ? 'text-cyan-400' : 'text-slate-500'">
              {{ item.icon }}
            </mat-icon>
            <span>{{ item.label }}</span>
          </div>

          @if (item.badgeCount && item.badgeCount() > 0) {
            <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
              {{ item.badgeCount() }}
            </span>
          }
        </button>
      }
    </nav>
  </div>

  <!-- Bottom CTA: WhatsApp Link tab -->
  <div class="space-y-3 pt-4 border-t border-white/5">
    <button
      type="button"
      (click)="openQrModal()"
      class="w-full flex items-center justify-between p-3 rounded-2xl bg-gradient-to-r from-cyan-950/40 to-blue-950/40 border border-cyan-500/20 hover:border-cyan-500/50 transition-all cursor-pointer group"
    >
      <div class="flex items-center gap-2.5">
        <mat-icon class="text-cyan-400 text-lg">qr_code_scanner</mat-icon>
        <span class="text-xs font-bold text-slate-200">Vincular WhatsApp</span>
      </div>
      <span class="w-2 h-2 rounded-full" [ngClass]="botStatus() === 'active' ? 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]' : 'bg-amber-400 animate-pulse'"></span>
    </button>

    <!-- Bot Status Footer -->
    <div class="flex items-center justify-between px-3 py-2 text-[11px] font-mono text-slate-500">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full" [ngClass]="botStatus() === 'active' ? 'bg-emerald-400' : 'bg-rose-500'"></span>
        <span>Bot {{ botStatus() === 'active' ? 'encendido' : 'apagado' }}</span>
      </div>
      <span class="text-[10px] text-slate-600">v2.0</span>
    </div>
  </div>
</aside>
